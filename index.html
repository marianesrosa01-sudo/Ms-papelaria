body{margin:0;font-family:'Nunito',sans-serif;background:#f5f0ff;overscroll-behavior:none;}
button{transition:opacity .15s,transform .15s;cursor:pointer;}
button:active{opacity:.75;transform:scale(.97);}
input,select{-webkit-appearance:none;outline:none;}
input:focus,select:focus{border-color:#a78bfa!important;box-shadow:0 0 0 3px rgba(167,139,250,.2);}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:#f3e8ff;}
::-webkit-scrollbar-thumb{background:#c4b5fd;border-radius:10px;}

@keyframes slideDown{from{transform:translateX(-50%) translateY(-12px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}

async function sfetch(path, opts={}) {
  const tok = opts.token || SKEY;
  const res = await fetch(SURL+path, {
    ...opts,
    headers:{"apikey":SKEY,"Authorization":"Bearer "+tok,"Content-Type":"application/json",...(opts.headers||{})},
  });
  return {data:await res.json(), ok:res.ok, status:res.status};
}
async function signIn(email,pass){return sfetch("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email,password:pass})});}
async function signUp(email,pass){return sfetch("/auth/v1/signup",{method:"POST",body:JSON.stringify({email,password:pass})});}
async function signOut(tok){return sfetch("/auth/v1/logout",{method:"POST",token:tok});}
function signInGoogle(){window.location.href=SURL+"/auth/v1/authorize?provider=google&redirect_to="+encodeURIComponent(window.location.origin);}
function parseSession(){
  try{
    const h=window.location.hash;
    if(h){const p=new URLSearchParams(h.replace("#",""));const t=p.get("access_token");if(t){window.history.replaceState(null,"",window.location.pathname);return{token:t,email:p.get("email")||""};}}
    const s=localStorage.getItem("ms_sess");return s?JSON.parse(s):null;
  }catch(e){return null;}
}
function getUID(tok){try{return JSON.parse(atob(tok.split(".")[1])).sub;}catch(e){return null;}}
async function dbLoad(tok,uid){
  const r=await sfetch("/rest/v1/ms_dados?user_id=eq."+uid+"&select=dados&limit=1",{token:tok});
  if(r.ok&&r.data&&r.data[0]&&r.data[0].dados){try{return JSON.parse(r.data[0].dados);}catch(e){}}
  return null;
}
async function dbSave(tok,uid,dados){
  const check=await sfetch("/rest/v1/ms_dados?user_id=eq."+uid+"&select=id",{token:tok});
  const body=JSON.stringify({user_id:uid,dados:JSON.stringify(dados),updated_at:new Date().toISOString()});
  if(check.ok&&check.data&&check.data.length>0){
    return sfetch("/rest/v1/ms_dados?user_id=eq."+uid,{method:"PATCH",token:tok,headers:{"Prefer":"return=minimal"},body});
  }
  return sfetch("/rest/v1/ms_dados",{method:"POST",token:tok,headers:{"Prefer":"return=minimal"},body});
}

function calcFicha(ficha){
  const mat=(ficha.mats||[]).reduce((s,m)=>s+(m.qtd*m.cu),0);
  const mao=(ficha.horas||0)*(ficha.hvl||0);
  const tot=mat+mao;
  const luc=(ficha.venda||0)-tot;
  const mrg=(ficha.venda>0)?Math.round((luc/ficha.venda)*100):0;
  return {mat,mao,tot,luc,mrg};
}
function calcOrc(orc){
  const sub=(orc.itens||[]).reduce((s,i)=>s+(i.qtd*i.vu),0);
  const tot=sub*(1-(orc.desc||0)/100);
  return {sub,tot};
}

        <div style={{padding:mobile?"10px 12px 0":"12px 24px 0",display:"grid",gridTemplateColumns:mobile?"1fr":"1fr 1fr 1fr",gap:mobile?10:14}}>
          <Card>
            <div style={{fontWeight:800,color:"#5b21b6",fontSize:14,fontFamily:"Playfair Display,serif",marginBottom:10}}>📦 Pedidos por Status</div>
            {Object.entries(STATUS_CFG).map(([k,v])=>{
              const cnt=data.pedidos.filter(p=>p.status===k).length;
              const pct=data.pedidos.length?(cnt/data.pedidos.length)*100:0;
              return <div key={k} style={{marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12,fontWeight:700,marginBottom:2}}><span style={{color:"#374151"}}>{v.lb} ({cnt})</span><span style={{color:v.cl}}>{toBRL(data.pedidos.filter(p=>p.status===k).reduce((s,p)=>s+p.valor,0))}</span></div>
                <div style={{background:"#f3f4f6",borderRadius:6,height:7,overflow:"hidden"}}><div style={{width:pct+"%",background:v.dt,height:"100%",borderRadius:6}}/></div>
              </div>;
            })}
          </Card>
          <Card>
            <div style={{fontWeight:800,color:"#5b21b6",fontSize:14,fontFamily:"Playfair Display,serif",marginBottom:10}}>⭐ Top Clientes</div>
            {topCl.length===0&&<div style={{color:"#c4b5fd",textAlign:"center",padding:"16px 0",fontSize:13}}>Sem dados ainda</div>}
            {topCl.map(([nome,val],i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderBottom:"1px solid #f5f0ff"}}>
                <div style={{width:26,height:26,borderRadius:"50%",background:"linear-gradient(135deg,#e9d5ff,#c4b5fd)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,color:"#7c3aed",fontSize:12,flexShrink:0}}>{i+1}</div>
                <div style={{flex:1,fontWeight:700,color:"#374151",fontSize:12,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{nome}</div>
                <div style={{fontWeight:900,color:"#7c3aed",fontSize:12,flexShrink:0}}>{toBRL(val)}</div>
              </div>
            ))}
          </Card>
          <Card>
            <div style={{fontWeight:800,color:"#5b21b6",fontSize:14,fontFamily:"Playfair Display,serif",marginBottom:10}}>🏆 Mais Pedidos</div>
            {topPr.length===0&&<div style={{color:"#c4b5fd",textAlign:"center",padding:"16px 0",fontSize:13}}>Sem dados ainda</div>}
            {topPr.map(([nome,cnt],i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderBottom:"1px solid #f5f0ff"}}>
                <div style={{width:26,height:26,borderRadius:"50%",background:"linear-gradient(135deg,#fce7f3,#fbcfe8)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,color:"#db2777",fontSize:12,flexShrink:0}}>{i+1}</div>
                <div style={{flex:1,fontWeight:700,color:"#374151",fontSize:12,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{nome}</div>
                <div style={{fontWeight:900,color:"#db2777",fontSize:12,flexShrink:0}}>{cnt}x</div>
              </div>
            ))}
          </Card>
        </div>
      </div>;
    })()}
  </div>;

  // ── MODALS ──
  const Modals=()=><>
    {dlg&&<DelDlg msg={dlg.msg} onClose={()=>setDlg(null)} onOk={()=>upd(dlg.tipo,dlg.id)}/>}

    {modal==="ped"&&<Sheet title={form.id?"✏️ Editar Pedido":"📦 Novo Pedido"} onClose={closeModal} onSave={savePed}>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Inp label="Cliente *" value={form.cliente} onChange={F("cliente")}/>
        <Inp label="Item *" value={form.item} onChange={F("item")}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Inp label="Qtd" type="number" value={form.qtd} onChange={F("qtd")}/>
          <Inp label="Valor R$ *" type="number" value={form.valor} onChange={F("valor")}/>
        </div>
        <Inp label="Data" type="date" value={form.data} onChange={F("data")}/>
        <Sel label="Status" value={form.status||"aguardando"} onChange={F("status")} opts={Object.entries(STATUS_CFG).map(([k,v])=>({v:k,l:v.lb}))}/>
      </div>
    </Sheet>}

    {modal==="est"&&<Sheet title={form.id?"✏️ Editar Item":"🗂️ Novo Item"} onClose={closeModal} onSave={saveEst}>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Inp label="Nome *" value={form.nome} onChange={F("nome")}/>
        <Inp label="Unidade (folhas, rolo...)" value={form.un} onChange={F("un")}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Inp label="Qtd *" type="number" value={form.qtd} onChange={F("qtd")}/>
          <Inp label="Qtd Mínima" type="number" value={form.min} onChange={F("min")}/>
        </div>
        <Inp label="Custo Unitário R$" type="number" value={form.custo} onChange={F("custo")}/>
      </div>
    </Sheet>}

    {modal==="gas"&&<Sheet title={form.id?"✏️ Editar Gasto":"💸 Novo Gasto"} onClose={closeModal} onSave={saveGas}>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Inp label="Descrição *" value={form.desc} onChange={F("desc")}/>
        <Sel label="Categoria" value={form.cat} onChange={F("cat")} opts={[{v:"",l:"Selecione..."},...CATS.map(c=>({v:c,l:c}))]}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Inp label="Valor Total R$ *" type="number" value={form.valor} onChange={F("valor")}/>
          <Inp label="Qtd/Folhas" type="number" value={form.qtd} onChange={F("qtd")} ph="Ex: 100"/>
        </div>
        <Inp label="Data" type="date" value={form.data} onChange={F("data")}/>
        {form.valor&&form.qtd&&+form.qtd>0&&<div style={{background:"#ede9fe",borderRadius:12,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",border:"1.5px solid #c4b5fd"}}>
          <span style={{fontWeight:700,color:"#5b21b6",fontSize:12}}>💡 Custo por unidade</span>
          <span style={{fontWeight:900,color:"#7c3aed",fontSize:18}}>{toBRL(+form.valor/+form.qtd)}</span>
        </div>}
      </div>
    </Sheet>}

    {modal==="prod"&&<Sheet title={form.id?"✏️ Editar Produto":"🏷️ Novo Produto"} onClose={closeModal} onSave={saveProd} btn="💾 Salvar Produto">
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Inp label="Nome do Produto *" value={form.nome} onChange={F("nome")}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Inp label="Preço R$ *" type="number" value={form.preco} onChange={F("preco")}/>
          <Inp label="Unidade (unid, par...)" value={form.un||"unid"} onChange={F("un")}/>
        </div>
        <Sel label="Categoria" value={form.cat} onChange={F("cat")} opts={[{v:"",l:"Selecione..."},...PROD_CATS.map(c=>({v:c,l:c}))]}/>
        <Inp label="Observação" value={form.obs} onChange={F("obs")} ph="Ex: inclui personalização"/>
      </div>
    </Sheet>}

    {modal==="ficha"&&<Sheet title={form.id?"✏️ Editar Ficha":"🧮 Nova Ficha de Custo"} onClose={closeModal} onSave={saveFicha} btn="💾 Salvar Ficha">
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Inp label="Nome do Produto *" value={form.nome} onChange={F("nome")}/>
        <Inp label="Preço de Venda R$ *" type="number" value={form.venda} onChange={F("venda")}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Inp label="Tempo (horas)" type="number" value={form.horas} onChange={F("horas")}/>
          <Inp label="R$ por hora" type="number" value={form.hvl} onChange={F("hvl")}/>
        </div>
        {(form.venda||form.horas)&&(()=>{
          const pp={venda:+form.venda||0,horas:+form.horas||0,hvl:+form.hvl||0,mats:mats.filter(m=>m.nome&&m.qtd&&m.cu).map(m=>({...m,qtd:+m.qtd,cu:+m.cu}))};
          const cc=calcFicha(pp);
          return <div style={{background:"linear-gradient(135deg,#e0f2fe,#f0f9ff)",borderRadius:14,padding:"12px",border:"1.5px solid #7dd3fc"}}>
            <div style={{fontWeight:800,color:"#0891b2",fontSize:11,marginBottom:8}}>📊 Preview ao vivo</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
              {[{l:"Custo",v:toBRL(cc.tot),c:"#dc2626"},{l:"Lucro",v:toBRL(cc.luc),c:cc.luc>=0?"#059669":"#dc2626"},{l:"Materiais",v:toBRL(cc.mat),c:"#0891b2"},{l:"Mão de Obra",v:toBRL(cc.mao),c:"#7c3aed"}].map((x,i)=>(
                <div key={i} style={{background:"#fff",borderRadius:10,padding:"8px"}}><div style={{fontSize:9,color:"#9ca3af",fontWeight:700}}>{x.l}</div><div style={{fontSize:13,fontWeight:900,color:x.c}}>{x.v}</div></div>
              ))}
            </div>
            <div style={{marginTop:8}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:10,fontWeight:700,color:"#6b7280",marginBottom:2}}><span>Margem</span><span style={{color:cc.luc>=0?"#059669":"#dc2626"}}>{cc.mrg}%</span></div>
              <div style={{background:"#e0f2fe",borderRadius:6,height:6,overflow:"hidden"}}><div style={{width:Math.max(0,Math.min(100,cc.mrg))+"%",background:cc.luc>=0?"#10b981":"#ef4444",height:"100%",borderRadius:6,transition:"width .3s"}}/></div>
            </div>
          </div>;
        })()}
        <div style={{background:"#f9fafb",borderRadius:14,padding:"12px",border:"1px solid #f0e6ff"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontWeight:800,color:"#374151",fontSize:13}}>📦 Materiais</span>
            <button onClick={()=>setMats(m=>[...m,{nome:"",qtd:"",cu:""}])} style={{background:"#ede9fe",color:"#7c3aed",border:"none",borderRadius:8,padding:"5px 10px",fontWeight:700,fontFamily:"inherit",fontSize:12}}>+ Add</button>
          </div>
          {mats.length===0&&<div style={{textAlign:"center",color:"#c4b5fd",fontSize:12,padding:"6px 0"}}>Nenhum material</div>}
          {mats.map((m,i)=>(
            <div key={i} style={{background:"#fff",borderRadius:10,padding:"10px",marginBottom:6,border:"1px solid #e9d5ff"}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:11,fontWeight:700,color:"#7c3aed"}}>Material {i+1}</span><button onClick={()=>setMats(ms=>ms.filter((_,j)=>j!==i))} style={{background:"#fee2e2",color:"#ef4444",border:"none",borderRadius:6,padding:"2px 7px",fontSize:11}}>✕</button></div>
              <Inp label="Nome" value={m.nome} onChange={v=>setMats(ms=>ms.map((x,j)=>j===i?{...x,nome:v}:x))}/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:8}}>
                <Inp label="Qtd" type="number" value={m.qtd} onChange={v=>setMats(ms=>ms.map((x,j)=>j===i?{...x,qtd:v}:x))}/>
                <Inp label="R$/un" type="number" value={m.cu} onChange={v=>setMats(ms=>ms.map((x,j)=>j===i?{...x,cu:v}:x))}/>
              </div>
              {m.qtd&&m.cu&&<div style={{marginTop:5,textAlign:"right",fontWeight:900,color:"#7c3aed",fontSize:12}}>= {toBRL(+m.qtd*(+m.cu))}</div>}
            </div>
          ))}
        </div>
      </div>
    </Sheet>}

    {modal==="orc"&&<Sheet title={form.id?"✏️ Editar Orçamento":"📋 Novo Orçamento"} onClose={closeModal} onSave={saveOrc} btn="💾 Salvar Orçamento">
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Inp label="Cliente *" value={form.cliente} onChange={F("cliente")}/>
        <Inp label="Telefone (WhatsApp)" value={form.tel} onChange={F("tel")} ph="(11) 99999-0000"/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Inp label="Data" type="date" value={form.data} onChange={F("data")}/>
          <Inp label="Válido até" type="date" value={form.val} onChange={F("val")}/>
          <Inp label="Desconto %" type="number" value={form.desc||"0"} onChange={F("desc")}/>
          <Sel label="Status" value={form.status||"pendente"} onChange={F("status")} opts={Object.entries(ORC_CFG).map(([k,v])=>({v:k,l:v.lb}))}/>
        </div>
        <div style={{background:"#f9fafb",borderRadius:14,padding:"12px",border:"1px solid #e0f2fe"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontWeight:800,color:"#374151",fontSize:13}}>📦 Itens</span>
            <button onClick={()=>setItens(m=>[...m,{desc:"",qtd:"1",vu:""}])} style={{background:"#e0f2fe",color:"#0e7490",border:"none",borderRadius:8,padding:"5px 10px",fontWeight:700,fontFamily:"inherit",fontSize:12}}>+ Manual</button>
          </div>
          {data.produtos.length>0&&<div style={{marginBottom:8}}>
            <div style={{fontSize:10,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",marginBottom:5}}>🏷️ Da tabela de preços:</div>
            <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:4}}>
              {data.produtos.map(prod=>(
                <button key={prod.id} onClick={()=>setItens(m=>[...m,{desc:prod.nome,qtd:"1",vu:String(prod.preco)}])} style={{flexShrink:0,background:"linear-gradient(135deg,#fdf2f8,#fce7f3)",color:"#be185d",border:"1.5px solid #fbcfe8",borderRadius:12,padding:"6px 12px",fontFamily:"inherit",textAlign:"left",minWidth:110}}>
                  <div style={{fontWeight:800,fontSize:11,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:100}}>{prod.nome}</div>
                  <div style={{fontWeight:900,color:"#9d174d",fontSize:12}}>{toBRL(prod.preco)}</div>
                </button>
              ))}
            </div>
          </div>}
          {itens.map((it,i)=>(
            <div key={i} style={{background:"#fff",borderRadius:10,padding:"10px",marginBottom:6,border:"1px solid #e0f2fe"}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:11,fontWeight:700,color:"#0e7490"}}>Item {i+1}</span><button onClick={()=>setItens(m=>m.filter((_,j)=>j!==i))} style={{background:"#fee2e2",color:"#ef4444",border:"none",borderRadius:6,padding:"2px 7px",fontSize:11}}>✕</button></div>
              <Inp label="Descrição" value={it.desc} onChange={v=>setItens(ms=>ms.map((x,j)=>j===i?{...x,desc:v}:x))}/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:8}}>
                <Inp label="Qtd" type="number" value={it.qtd} onChange={v=>setItens(ms=>ms.map((x,j)=>j===i?{...x,qtd:v}:x))}/>
                <Inp label="R$/un" type="number" value={it.vu} onChange={v=>setItens(ms=>ms.map((x,j)=>j===i?{...x,vu:v}:x))}/>
              </div>
              {it.qtd&&it.vu&&<div style={{marginTop:5,textAlign:"right",fontWeight:900,color:"#0e7490",fontSize:12}}>= {toBRL(+it.qtd*(+it.vu))}</div>}
            </div>
          ))}
          {itens.some(i=>i.qtd&&i.vu)&&(()=>{
            const sub=itens.filter(i=>i.qtd&&i.vu).reduce((s,i)=>s+(+i.qtd)*(+i.vu),0);
            const tot=sub*(1-(+form.desc||0)/100);
            return <div style={{background:"linear-gradient(135deg,#e0f2fe,#f0f9ff)",borderRadius:12,padding:"10px 14px",border:"1.5px solid #7dd3fc",display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:6}}>
              <span style={{fontWeight:800,color:"#0e7490",fontSize:12}}>💰 Total ao vivo</span>
              <span style={{fontWeight:900,color:"#0e7490",fontSize:20}}>{toBRL(tot)}</span>
            </div>;
          })()}
        </div>
        <Inp label="Observações" value={form.obs} onChange={F("obs")} ph="Informações adicionais..."/>
      </div>
    </Sheet>}
  </>;

  // ── RENDER ──
  if(mobile) return <div style={{maxWidth:480,margin:"0 auto",minHeight:"100vh",background:"#f5f0ff",display:"flex",flexDirection:"column"}}>
    {/* mobile top nav */}
    <div style={{background:"linear-gradient(135deg,"+tc+","+tc+"dd)",paddingTop:"env(safe-area-inset-top,44px)",flexShrink:0,position:"sticky",top:0,zIndex:50,boxShadow:"0 2px 12px rgba(0,0,0,.15)",transition:"background .3s"}}>
      <div style={{height:4,background:"repeating-linear-gradient(90deg,#f9a8d4 0,#f9a8d4 10px,rgba(255,255,255,0) 10px,rgba(255,255,255,0) 16px)",opacity:.7}}/>
      <div style={{display:"flex",padding:"0 2px",overflowX:"auto"}}>
        {TABS.map(n=>(
          <button key={n.k} onClick={()=>goTab(n.k)} style={{flex:"0 0 auto",minWidth:50,display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"7px 3px 9px",background:"transparent",border:"none",fontFamily:"inherit",position:"relative",transition:"all .2s"}}>
            {n.bd>0&&<span style={{position:"absolute",top:3,right:3,minWidth:14,height:14,borderRadius:"50%",background:"#f9a8d4",color:"#9d174d",fontSize:8,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center"}}>{n.bd}</span>}
            <span style={{fontSize:18,transition:"transform .2s",transform:aba===n.k?"scale(1.15)":"scale(1)"}}>{n.ic}</span>
            <span style={{fontSize:8,fontWeight:aba===n.k?900:600,color:aba===n.k?"#fff":"rgba(255,255,255,.6)",whiteSpace:"nowrap"}}>{n.lb}</span>
            {aba===n.k&&<span style={{position:"absolute",bottom:0,left:"50%",transform:"translateX(-50%)",width:16,height:3,background:"#fff",borderRadius:"3px 3px 0 0"}}/>}
          </button>
        ))}
      </div>
      <div style={{display:"flex",justifyContent:"flex-end",alignItems:"center",padding:"2px 10px 5px",gap:8}}>
        {saving?<span style={{fontSize:9,color:"rgba(255,255,255,.7)",fontWeight:700}}>● salvando...</span>:<span style={{fontSize:9,color:"rgba(255,255,255,.55)",fontWeight:700}}>● salvo</span>}
        <span style={{fontSize:10,color:"rgba(255,255,255,.55)",maxWidth:140,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{sess.email}</span>
        <button onClick={async()=>{await signOut(sess.token);setSess(null);}} style={{background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,255,255,.25)",borderRadius:8,padding:"3px 8px",color:"#fff",fontSize:10,fontWeight:700,fontFamily:"inherit"}}>Sair</button>
      </div>
    </div>
    {toast&&<div style={{position:"fixed",top:80,left:"50%",transform:"translateX(-50%)",zIndex:9999,background:toast.err?"#dc2626":"linear-gradient(90deg,#7c3aed,#a78bfa)",color:"#fff",borderRadius:14,padding:"10px 20px",fontWeight:700,boxShadow:"0 4px 20px rgba(0,0,0,.2)",fontSize:13,whiteSpace:"nowrap",animation:"slideDown .3s ease"}}>
      {toast.err?"❌":"✅"} {toast.msg}
    </div>}
    <div style={{flex:1,overflowY:"auto"}}><Content/></div>
    <Modals/>
  </div>;

  // desktop
  return <div style={{display:"flex",minHeight:"100vh",background:"#f5f0ff"}}>
    <Sidebar/>
    {toast&&<div style={{position:"fixed",top:20,right:24,zIndex:9999,background:toast.err?"#dc2626":"linear-gradient(90deg,#7c3aed,#a78bfa)",color:"#fff",borderRadius:14,padding:"10px 22px",fontWeight:700,boxShadow:"0 4px 20px rgba(0,0,0,.2)",fontSize:14,animation:"fadeIn .3s ease"}}>
      {toast.err?"❌":"✅"} {toast.msg}
    </div>}
    <main style={{marginLeft:220,flex:1,overflowY:"auto",minHeight:"100vh"}}>
      <Content/>
    </main>
    <Modals/>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
